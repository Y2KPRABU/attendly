<script>
const mode = "{mode}";
if (mode === "push") {
  const route = "{route}";
  const query = "{query}";
  window.parent.location.replace(route + query);
} else if (mode === "sync") {
  const path = window.parent.location.pathname;
  const search = window.parent.location.search;
  const match = path.match(/^\/event\/([^\/]+)(\/info)?\/?$/);
  if (match && !new URLSearchParams(search).has('event')) {
      const eventId = match[1];
      const info = !!match[2];
      const url = path + '?event=' + encodeURIComponent(eventId) + (info ? '&info=true' : '');
      window.parent.location.replace(url);
  }
}
</script>
