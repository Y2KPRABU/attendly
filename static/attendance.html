<div style="max-width:640px;margin:0 auto;padding:18px;border:1px solid #ddd;border-radius:12px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,0.08);font-family:system-ui, sans-serif;">
  <h2 style="margin-top:0;">RSVP for {event_name}</h2>
  <p style="color:#555;margin-bottom:18px;">Complete this attendance form for event <strong>{event_id}</strong>.</p>
  <form method="get" action="" style="display:grid;gap:14px;">
    <input type="hidden" name="event" value="{event_id}">
    <input type="hidden" name="submit" value="1">

    <label style="display:grid;gap:8px;font-weight:600;color:#222;">
      Response
      <select name="response" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;" required>
        <option value="">Select response</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
        <option value="Maybe">Maybe</option>
      </select>
    </label>

    <label style="display:grid;gap:8px;font-weight:600;color:#222;">
      Main attendee name
      <input name="name" type="text" placeholder="Enter name" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;" />
    </label>

    <div style="display:grid;gap:14px;grid-template-columns:1fr 1fr;">
      <label style="display:grid;gap:8px;font-weight:600;color:#222;">
        Adult count
        <input name="adult_count" type="number" min="1" max="10" value="1" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;" />
      </label>
      <label style="display:grid;gap:8px;font-weight:600;color:#222;">
        Child count
        <input name="child_count" type="number" min="0" max="10" value="0" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;" />
      </label>
    </div>

    <button type="submit" style="padding:12px 18px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">Save RSVP</button>
  </form>
</div>
