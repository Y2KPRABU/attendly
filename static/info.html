<div style="max-width:760px;margin:0 auto;padding:20px;border:1px solid #ddd;border-radius:14px;background:#fff;box-shadow:0 5px 24px rgba(0,0,0,0.08);font-family:system-ui, sans-serif;">
  <h2 style="margin-top:0;">Attendance details for {event_name}</h2>
  <p style="margin-bottom:18px;color:#555;">Event ID: <strong>{event_id}</strong></p>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;padding:16px;background:#f9fafb;border-radius:12px;">
    <div><strong>Responses</strong><div style="font-size:28px;color:#111;margin-top:8px;">{registered_count}</div></div>
    <div><strong>Adults</strong><div style="font-size:28px;color:#111;margin-top:8px;">{total_adults}</div></div>
    <div><strong>Children</strong><div style="font-size:28px;color:#111;margin-top:8px;">{total_children}</div></div>
    <div><strong>Total</strong><div style="font-size:28px;color:#111;margin-top:8px;">{total_adults_plus_children}</div></div>
  </div>
  <table style="width:100%;border-collapse:collapse;margin-top:22px;">
    <thead>
      <tr style="background:#eef2ff;color:#111;text-align:left;">
        <th style="padding:12px 14px;border-bottom:1px solid #d1d5db;">Name</th>
        <th style="padding:12px 14px;border-bottom:1px solid #d1d5db;">Response</th>
        <th style="padding:12px 14px;border-bottom:1px solid #d1d5db;">Adults</th>
        <th style="padding:12px 14px;border-bottom:1px solid #d1d5db;">Children</th>
      </tr>
    </thead>
    <tbody>
      {rows}
    </tbody>
  </table>
</div>
